name: Bug report
description: Something in the plugin, skill or ac.py didn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API key, tenant URL or tenant data here.** For security issues, use SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From your agent's plugin list, `npx skills list`, or the zip name
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which agent or app
      options:
        - Claude Code (terminal or IDE)
        - Claude Desktop, Code tab
        - Claude Desktop, Cowork
        - Claude chat (Desktop or claude.ai)
        - OpenAI Codex
        - GitHub Copilot (CLI or VS Code)
        - Cursor
        - Gemini CLI
        - Grok Build
        - Other (say which below)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you asked and what happened
      description: Your request to Claude, the `ac.py` command it ran, the plan id if any, and the output or error (with anything sensitive removed)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
